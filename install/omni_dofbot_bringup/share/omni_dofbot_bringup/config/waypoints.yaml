# waypoints.yaml — v2
#
# Cambios respecto a v1:
#   - Cajas movidas al centro (x=0) para trayectoria simétrica
#   - 4 waypoints intermedios en lugar de 2 (zigzag más pronunciado)
#   - Offsets laterales aumentados a ±0.38m para evitar colisiones
#   - Margen de seguridad: 0.38 - 0.075(radio_caja) - 0.18(inflación) = 0.125m libre
#
# Layout (vista superior, +Y = norte):
#
#   [META]  WP6 (0, +0.71)
#             |
#   [O1 x=0,y=+0.25]
#   WP5 (+0.38,+0.38) ←→ WP4 (-0.38,+0.13)
#             |
#   [O2 x=0,y=-0.30]
#   WP3 (+0.38,-0.18) ←→ WP2 (-0.38,-0.42)
#             |
#   [INICIO] WP1 (0, -0.91)


waypoints:

  - id: 1
    label: "spawn_inicio"
    x:    0.00
    y:   -0.91
    yaw:  0.00
    note: "Posición de spawn. Nav2 no recibe este WP — es solo el punto de reset."

  - id: 2
    label: "izquierda_bajo_O2"
    x:   -0.38
    y:   -0.42
    yaw:  0.20
    note: >
      Pasar a la izquierda de O2 (en x=0, y=-0.30).
      Offset lateral: 0.38m del centro de la caja.
      Margen real sobre inflación: 0.38 - 0.075 - 0.18 = 0.125m.

  - id: 3
    label: "derecha_bajo_O2"
    x:    0.38
    y:   -0.18
    yaw: -0.20
    note: "Pasar a la derecha de O2. El robot hace el primer cruce del zigzag."

  - id: 4
    label: "izquierda_encima_O1"
    x:   -0.38
    y:    0.13
    yaw:  0.20
    note: >
      Pasar a la izquierda de O1 (en x=0, y=+0.25).
      El robot cruza el centro entre las dos cajas.

  - id: 5
    label: "derecha_encima_O1"
    x:    0.38
    y:    0.38
    yaw: -0.20
    note: "Pasar a la derecha de O1. Último cruce antes de la meta."

  - id: 6
    label: "meta_pedestal"
    x:    0.00
    y:    0.71
    yaw:  0.00
    note: >
      Posición de llegada frente al pedestal (en y=+0.81).
      Offset de 0.10m para no colisionar. Orientado al norte
      para que el brazo Dofbot apunte al cubo objetivo.


obstacles:
  - id: "O1"
    label: "caja_norte"
    x:     0.00
    y:     0.25
    z:     0.175
    size_x: 0.15
    size_y: 0.15
    size_z: 0.35

  - id: "O2"
    label: "caja_sur"
    x:     0.00
    y:    -0.30
    z:     0.175
    size_x: 0.15
    size_y: 0.15
    size_z: 0.35


pedestal:
  x:     0.00
  y:     0.81
  z:     0.10
  size_x: 0.15
  size_y: 0.15
  size_z: 0.20


cube_positions:
  - id: "center"
    x:  0.00
    y:  0.81
    z:  0.2125
  - id: "left"
    x: -0.10
    y:  0.81
    z:  0.2125
  - id: "right"
    x:  0.10
    y:  0.81
    z:  0.2125


arena:
  width:  1.22
  length: 2.42
  floor_friction: 0.4
  world_name: "arena_world"
  robot_name: "omni_dofbot"