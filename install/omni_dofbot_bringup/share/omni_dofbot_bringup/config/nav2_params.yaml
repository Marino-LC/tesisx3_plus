# nav2_params.yaml — ROS 2 Jazzy (corregido)
#
# Fixes aplicados:
#   1. obstacle_layer y inflation_layer declarados con namespace completo
#      bajo local_costmap/global_costmap para que Nav2 encuentre 'plugin'
#   2. Critics de DWB declarados como string separado por comas (no lista YAML)
#   3. set_initial_pose: false en AMCL para evitar crash del state machine


amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    min_particles: 200
    max_particles: 1000
    laser_model_type: "likelihood_field"
    laser_max_range: 1.5
    laser_min_range: 0.15
    max_beams: 60
    set_initial_pose: false
    transform_tolerance: 0.5
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    tf_broadcast: true


bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
   # ¡NUEVO! Forzar árboles minimalistas sin recuperaciones
    default_bt_xml_filename: "navigate_to_pose_w_replanning_distance.xml"
    default_nav_through_poses_bt_xml_filename: "navigate_through_poses_w_replanning_distance.xml"
    default_nav_to_pose_bt_xml_filename: "navigate_to_pose_w_replanning_distance.xml"
    transform_tolerance: 0.5
    filter_duration: 0.3


planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: -0.30
      max_vel_x:  0.30
      min_vel_y: -0.30
      max_vel_y:  0.30
      min_vel_theta: -1.0
      max_vel_theta:  1.0
      min_speed_xy:   0.0
      max_speed_xy:   0.30
      min_speed_theta: 0.0
      acc_lim_x:      1.0
      acc_lim_y:      1.0
      acc_lim_theta:  2.0
      decel_lim_x:   -1.0
      decel_lim_y:   -1.0
      decel_lim_theta: -2.0
      vx_samples:     10
      vy_samples:     10
      vtheta_samples: 10
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.08
      short_circuit_trajectory_eval: true
      # FIX: critics como string con comas, NO como lista YAML []
      # La lista YAML causa "No critics defined" en Jazzy/DWB
      critics: ["RotateToGoal","Oscillation","BaseObstacle","GoalAlign","PathAlign","PathDist","GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale:    32.0
      GoalAlign.scale:    24.0
      PathDist.scale:     32.0
      GoalDist.scale:     24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


# FIX: los plugins del costmap deben declararse con su namespace completo
# En Jazzy, local_costmap espera los parámetros bajo:
#   local_costmap.local_costmap.ros__parameters.<plugin_name>.plugin
# NO bajo local_costmap.local_costmap.ros__parameters.plugins.<plugin_name>

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width:  2
      height: 2
      resolution: 0.02
      footprint: "[ [0.14, 0.12], [0.14, -0.12], [-0.14, -0.12], [-0.14, 0.12] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.18
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.15
      resolution: 0.02
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.18
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True


map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65


behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup","drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0


smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:    [ 0.30,  0.30,  1.0]
    min_velocity:    [-0.30, -0.30, -1.0]
    max_accel:       [ 1.0,   1.0,   2.0]
    max_decel:       [-1.0,  -1.0,  -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.001, 0.001, 0.001]
    velocity_timeout: 1.0


collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: []
    observation_sources: []


waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0


lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor