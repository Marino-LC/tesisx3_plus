controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Descomentar cuando el brazo esté integrado
    # dofbot_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController
    # dofbot_gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


# FIX 4: JointGroupVelocityController necesita los parámetros bajo su propio
# namespace, con "joints" (lista) y "command_interfaces" (NO "interface_name").
# La key "interface_name" solo existe en forward_command_controller, no aquí.
wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_joint
      - front_right_joint
      - back_right_joint
      - back_left_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity


