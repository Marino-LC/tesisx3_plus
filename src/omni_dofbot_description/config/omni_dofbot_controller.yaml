controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    dofbot_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dofbot_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_joint
      - front_right_joint
      - back_right_joint
      - back_left_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity


dofbot_trajectory_controller:
  ros__parameters:
    joints:
      - arm_joint_01
      - arm_joint_02
      - arm_joint_03
      - arm_joint_04
      - arm_joint_05
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0


dofbot_gripper_controller:
  ros__parameters:
    joints:
      - grip_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
