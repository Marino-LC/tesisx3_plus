# waypoints.yaml
#
# Trayectoria en zigzag para la arena de pruebas 1.22 × 2.42 m.
# Origen en el centro geométrico de la arena.
# +Y apunta al norte (zona meta), -Y al sur (zona inicio).
#
# Este archivo se instala en:
#   share/omni_dofbot_bringup/config/waypoints.yaml
# y es leído por genetic_algorithm_node.py y send_waypoints.py.


# ── Waypoints de navegación ─────────────────────────────────────────────────
# Usados por Nav2 (navigate_through_poses).
# El AG envía WP2, WP3, WP4 (WP1 es la posición de spawn/reset).
#
# Orientación (yaw en radianes):
#   0.0    → apunta al norte (+Y)  — dirección principal de avance
#   0.30   → giro leve a la derecha (para salir de la evasión de O1)
#  -0.30   → giro leve a la izquierda (para salir de la evasión de O2)
#
# Márgenes de seguridad aplicados:
#   - Robot ancho: 0.22 m → necesita al menos 0.11 m de cada lado del obstáculo
#   - Obstáculos: 0.15 m de ancho → radio de evasión mínimo: 0.075 + 0.11 = 0.185 m
#   - Margen elegido: 0.35 m del centro de la arena → holgura real: 0.35 - 0.075 = 0.275 m ✓

waypoints:

  - id: 1
    label: "spawn_inicio"
    x:    0.00
    y:   -0.91
    yaw:  0.00
    note: >
      Posición de spawn del robot. Centro del lado sur de la arena.
      El AG resetea al robot aquí antes de cada evaluación.
      Nav2 no recibe este waypoint — es solo el punto de partida.

  - id: 2
    label: "evasion_O1_izquierda"
    x:   -0.35
    y:    0.10
    yaw:  0.30
    note: >
      Pasar a la izquierda del Obstáculo 1 (en x=-0.20).
      Offset lateral: 0.35 - 0.20 = 0.15 m entre el waypoint y el obstáculo.
      El yaw de 0.30 rad orienta al robot hacia el WP3 (derecha).

  - id: 3
    label: "evasion_O2_derecha"
    x:    0.35
    y:   -0.40
    yaw: -0.30
    note: >
      Pasar a la derecha del Obstáculo 2 (en x=+0.20).
      Offset lateral: 0.35 - 0.20 = 0.15 m entre el waypoint y el obstáculo.
      El yaw de -0.30 rad orienta al robot hacia el WP4 (ligeramente izquierda).

  - id: 4
    label: "meta_pedestal"
    x:    0.00
    y:    0.71
    yaw:  0.00
    note: >
      Posición de llegada frente al pedestal (en y=+0.81).
      Offset de 0.10 m para evitar colisión con el pedestal.
      El robot llega orientado al norte con el brazo apuntando al cubo.
      Desde aquí se ejecuta la secuencia de agarre del Dofbot.


# ── Obstáculos (referencia para Nav2 costmap y visualización) ───────────────
obstacles:

  - id: "O1"
    label: "obstaculo_1_izquierdo"
    x:    -0.20
    y:     0.10
    z:     0.175
    size_x: 0.15
    size_y: 0.15
    size_z: 0.35

  - id: "O2"
    label: "obstaculo_2_derecho"
    x:     0.20
    y:    -0.40
    z:     0.175
    size_x: 0.15
    size_y: 0.15
    size_z: 0.35


# ── Pedestal y cubo objetivo ────────────────────────────────────────────────
pedestal:
  x:     0.00
  y:     0.81
  z:     0.10       # z_center del pedestal
  size_x: 0.15
  size_y: 0.15
  size_z: 0.20


# Posiciones variables del cubo para el AG.
# Entre evaluaciones el AG elige una de estas posiciones y
# reposiciona el cubo con gz service /world/arena_world/set_pose.
# z = altura_pedestal + cubo/2 = 0.20 + 0.0125 = 0.2125
cube_positions:

  - id: "center"
    label: "centro"
    x:  0.00
    y:  0.81
    z:  0.2125

  - id: "left"
    label: "izquierda"
    x: -0.12
    y:  0.81
    z:  0.2125

  - id: "right"
    label: "derecha"
    x:  0.12
    y:  0.81
    z:  0.2125


# ── Parámetros de la arena (referencia) ─────────────────────────────────────
arena:
  width:  1.22    # metros, eje X
  length: 2.42    # metros, eje Y
  floor_friction: 0.4   # melamina seca
  world_name: "arena_world"
  robot_name: "omni_dofbot"
